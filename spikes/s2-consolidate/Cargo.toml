[package]
name = "s2-consolidate"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
discussion-graph = { path = "../../crates/discussion-graph" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
summarize = { path = "../../crates/summarize" }
tokio = { version = "1", features = ["macros", "rt", "time"] }

tempfile = "3"
