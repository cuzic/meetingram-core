[package]
name = "s1-discussion-graph"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["argv-probe"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "process", "rt", "time"] }
