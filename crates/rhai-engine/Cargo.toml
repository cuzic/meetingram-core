[package]
name = "rhai-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rhai scripting engine for meetingram plugins. Provides a hook-based event dispatch system with a generic async command dispatcher for AI/HTTP calls."

[dependencies]
rhai = { version = "=1.27.0", features = ["sync"] }
dashmap = "6"
local-broker = { path = "../local-broker" }
transcript-event = { path = "../transcript-event" }
session-store = { path = "../session-store" }
credential-store = { path = "../credential-store" }
recorder-domain = { path = "../recorder-domain" }
summarize = { path = "../summarize" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "time", "macros"] }
tracing = "0.1"
thiserror = { workspace = true }
chrono = "0.4"
reqwest = { version = "0.13", features = ["json", "form"] }
# jsonwebtoken 10+ picks its crypto backend from exactly one of these features
# and panics on the first encode if none is enabled. aws-lc-rs is already in
# the tree through rustls.
jsonwebtoken = { version = "12", features = ["aws_lc_rs"] }
base64 = "0.23"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.11"
hmac = "0.13"
# Real, non-blocking silence-detection debounce timer for `hint.rhai`'s hint
# generation (`hint_debounce.rs`) — see that module's doc comment. Published
# by this repo's own maintainer; API confirmed directly against its source at
# the time this was added.
timed-fsm = { version = "0.5", features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
aws-lc-rs = "1"
