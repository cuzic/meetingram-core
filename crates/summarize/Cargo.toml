[package]
name = "summarize"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Thin wrapper over the genai crate for summarizing diarized meeting transcripts (multi-provider: Anthropic/OpenAI/Gemini/etc. via a model string)."

[dependencies]
async-trait = "0.1"
credential-store = { path = "../credential-store" }
gcp_auth = { version = "0.12", default-features = false, features = ["ring"] }
genai = "0.7.5"
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
thiserror = { workspace = true }
# "process" for `summarize_via_cli` (#59) spawning the `claude`/`codex` CLIs as
# subprocesses; "fs" for async-reading codex's `-o` output file.
tokio = { version = "1", features = ["process", "fs", "io-util", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Security", "Win32_System_JobObjects",
    "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_Threading",
] }
